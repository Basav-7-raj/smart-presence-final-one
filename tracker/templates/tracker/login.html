{% extends 'tracker/base.html' %}{% block title %}Admin Authentication{% endblock %}{% block content %}<div class="card login"><h2>Admin access</h2><p class="muted">People management, evidence, reports and system settings require authentication.</p><form method="post">{% csrf_token %}<label>Username</label><input class="input" name="username" autofocus><label style="display:block;margin-top:12px">Password</label><input class="input" type="password" name="password"><button class="btn" style="margin-top:16px;width:100%">Sign in securely</button>{% if form.errors %}<p class="red">Invalid username or password.</p>{% endif %}</form></div>{% endblock %}
